services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - cscms_data:/app/data
      # Uncomment after creating and securely protecting Google service-account JSON:
      # - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CSC_DOMAIN: ${CSC_DOMAIN:-portal.itbcarnegie.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  cscms_data:
  caddy_data:
  caddy_config:
